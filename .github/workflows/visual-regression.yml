name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose visual test target: QA or STAGE"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------
      # 🔍 DIAGNOSTIC + SAFE INSTALL
      # -----------------------------
      - name: Print Node & NPM versions
        run: |
          node -v
          npm -v

      - name: Show lockfile and fsevents references (diagnostics)
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found ✅"
          else
            echo "package-lock.json NOT found ❌"
          fi
          echo "Searching for 'fsevents' in manifest/lock:"
          (grep -n "fsevents" package.json || true)
          (grep -n "fsevents" package-lock.json || true)

      - name: Install dependencies (prefer lockfile; skip optionals)
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          NPM_CONFIG_OPTIONAL: "false"
        run: |
          set -euxo pipefail

          npm cache verify || true

          if [ -f package-lock.json ]; then
            echo "Using npm ci --omit=optional"
            npm ci --omit=optional
          else
            echo "No lockfile -> using npm install --no-optional"
            npm install --no-optional
          fi
      # -----------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Percy Visual Regression
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          ENV: ${{ github.event.inputs.target }}
          PERCY_BRANCH: ${{ github.event.inputs.target }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "QA" ]; then
            npm run qavisualregression
          else
            npm run stagevisualregression
          fi
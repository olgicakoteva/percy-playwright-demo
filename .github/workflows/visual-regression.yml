name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose visual test target: QA or STAGE"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Percy Visual Regression
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          ENV: ${{ github.event.inputs.target }}
          PERCY_BRANCH: ${{ github.event.inputs.target }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "QA" ]; then
            npm run qavisualregression
          else
            npm run stagevisualregression
          fi

name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose visual test target: QA or STAGE"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Print Node & NPM versions
        run: |
          node -v
          npm -v

      - name: Show lockfile and fsevents references
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found"
          else
            echo "package-lock.json NOT found"
          fi
          grep -R "fsevents" . || true

      - name: Patch lockfile to remove fsevents
        run: |
          if [ -f package-lock.json ]; then
            echo "Patching package-lock.json to remove fsevents..."
            node -e "
const fs = require('fs');
const path = 'package-lock.json';
if (!fs.existsSync(path)) { process.exit(0); }
let lock = JSON.parse(fs.readFileSync(path, 'utf8'));

function strip(obj) {
  if (!obj || typeof obj !== 'object') return;
  if (obj.dependencies && obj.dependencies.fsevents) delete obj.dependencies.fsevents;
  if (obj.optionalDependencies && obj.optionalDependencies.fsevents) delete obj.optionalDependencies.fsevents;
  for (const k of Object.keys(obj)) {
    if (k === 'fsevents') delete obj[k];
    else if (typeof obj[k] === 'object') strip(obj[k]);
  }
}
strip(lock);
if (lock.packages) {
  for (const k of Object.keys(lock.packages)) {
    if (k.includes('fsevents')) delete lock.packages[k];
  }
}
fs.writeFileSync(path, JSON.stringify(lock, null, 2));
console.log('fsevents removed from lockfile');
"
          fi

      - name: Install dependencies safely
        run: |
          if [ -f package-lock.json ]; then
            echo "Running npm ci --omit=optional --omit=dev"
            npm ci --omit=optional --omit=dev || (echo "ci failed, falling back to npm install"; npm install --no-optional --omit=dev)
          else
            echo "No lockfile -> npm install --no-optional --omit=dev"
            npm install --no-optional --omit=dev
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Percy Visual Regression
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          ENV: ${{ github.event.inputs.target }}
          PERCY_BRANCH: ${{ github.event.inputs.target }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "QA" ]; then
            npm run qavisualregression
          else
            npm run stagevisualregression
          fi

name: Visual Regression

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose visual test target: QA or STAGE"
        required: true
        default: "QA"
        type: choice
        options:
          - QA
          - STAGE

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ---------------------------------------------------
      # 🔍 Diagnostics (helps us see lockfile state)
      # ---------------------------------------------------
      - name: Print Node & NPM versions
        run: |
          node -v
          npm -v

      - name: Show lockfile and fsevents references (diagnostics)
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found ✅"
          else
            echo "package-lock.json NOT found ❌"
          fi
          echo "Searching for 'fsevents' in manifest/lock:"
          (grep -n '"fsevents"' package.json || true)
          (grep -n '"fsevents"' package-lock.json || true)

